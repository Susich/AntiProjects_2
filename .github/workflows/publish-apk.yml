name: Publish APK release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.6)
        required: true
        default: v1.0.6
      apk_url:
        description: Signed EAS APK artifact URL
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 10 --retry-delay 5 \
            --connect-timeout 30 --max-time 1800 \
            --output partysplit.apk "$APK_URL"
          ls -lh partysplit.apk
          file partysplit.apk
          test -s partysplit.apk

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" partysplit.apk --clobber
            gh release edit "$TAG" --notes-file .github/release-notes.md --latest
          else
            gh release create "$TAG" partysplit.apk \
              --title "PartySplit $TAG" \
              --notes-file .github/release-notes.md \
              --latest
          fi
